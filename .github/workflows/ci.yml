name: CI

# 브랜치 정책상 push 트리거는 main 만. PR 은 main·develop 양쪽 대상에서 검증한다 —
# feature→develop PR 에서도 게이트를 돌려, red 가 develop→main PR 까지 늦게 드러나지 않게 한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 게이트 목록의 SoT 는 package.json 의 `gates` 스크립트 — 로컬 pre-push 훅(.githooks/pre-push)
      # 도 같은 스크립트를 호출해 CI 와 로컬이 어긋나지 않는다(usage:check·build 순서 포함).
      - run: pnpm run gates
